[project]
name = "wilkr"
version = "0.1.0"
description = "Self-hosted, segments-first fitness platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "geoalchemy2>=0.15",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.6",
    "fitdecode>=0.10",
    "gpxpy>=1.6",
    "tcxreader>=0.4",
    "jinja2>=3.1",
    "garminconnect==0.3.15",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
