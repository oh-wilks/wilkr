{% extends "base.html" %}
{% block title %}Segments — wilkr{% endblock %}
{% block content %}
<form
  id="segment-filters"
  class="filter-bar"
  hx-get="/segments/rows"
  hx-target="#segment-list"
  hx-swap="innerHTML"
  hx-trigger="input changed delay:300ms from:#q, change from:#filter-sport, change from:#filter-sort"
>
  <input type="text" id="q" name="q" placeholder="Search segments…" value="{{ q }}">
  <select id="filter-sport" name="sport_id">
    <option value="">All sports</option>
    {% for sport in sports %}
    <option value="{{ sport.id }}" {% if sport_id == sport.id %}selected{% endif %}>{{ sport.name }}</option>
    {% endfor %}
  </select>
  <select id="filter-sort" name="sort">
    <option value="recent" {% if sort == "recent" %}selected{% endif %}>Most recent</option>
    <option value="distance" {% if sort == "distance" %}selected{% endif %}>Longest first</option>
    <option value="name" {% if sort == "name" %}selected{% endif %}>Name (A-Z)</option>
  </select>
</form>

<div id="segment-list">
  {% include "segments/_rows_partial.html" %}
</div>
{% endblock %}
